<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aarohana 2026 | Student Event Portal</title>
<style>
:root{--navy:#11152b;--panel:#191f3b;--panel2:#202849;--purple:#9b87ff;--cyan:#72e4dc;--text:#f5f6ff;--muted:#aab2d0;--line:#303958;--green:#72dfa7}
*{box-sizing:border-box}body{margin:0;background:#0c1022;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--purple);color:#17132d}button:hover{filter:brightness(1.08)}button.secondary{background:#293253;color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:8px}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#10152b;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#10152b;font-weight:900}.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}.navlabel{color:#737fa5;font-size:11px;font-weight:800;letter-spacing:1.4px;padding:0 12px;margin-top:8px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:600;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#242b4b;color:white}.nav button span{display:inline-block;width:27px}.sidebar-foot{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.5}.main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);gap:16px}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:12px}.avatar{width:35px;height:35px;border-radius:50%;background:#3a4165;display:grid;place-items:center;font-weight:800}.content{max-width:1250px;margin:auto;padding:30px 32px 55px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.hero{padding:32px;border:1px solid #34385f;border-radius:24px;background:radial-gradient(circle at 85% 15%,#423c7c 0,transparent 30%),linear-gradient(125deg,#242849,#171c36 65%);display:flex;justify-content:space-between;gap:22px;align-items:center;overflow:hidden}.hero h1{font-size:clamp(30px,4vw,49px);line-height:1.08;margin:12px 0}.hero p{max-width:570px;color:var(--muted);line-height:1.65}.hero-art{font-size:100px;filter:drop-shadow(0 12px 30px #080a1c);padding:0 22px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:27px;margin:9px 0 4px}.stat .ico{float:right;font-size:21px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 14px}.section-head h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.event-card{background:linear-gradient(150deg,#202747,#171d35);border:1px solid var(--line);border-radius:17px;padding:20px;display:flex;flex-direction:column;gap:12px}.tag{display:inline-flex;width:max-content;border-radius:999px;padding:5px 9px;background:#30305a;color:#c9c0ff;font-size:11px;font-weight:800}.event-card h3{margin:0;font-size:18px}.event-card p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}.event-meta{display:flex;flex-wrap:wrap;gap:12px;color:#c2c9e2;font-size:12px}.event-card .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:7px}.points{color:var(--green);font-weight:800}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.panel h2,.panel h3{margin-top:0}.profile{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:center}.bigavatar{width:100px;height:100px;border-radius:26px;background:linear-gradient(135deg,#8877ee,#73dcd5);color:#12152d;font-size:34px;font-weight:900;display:grid;place-items:center}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.detail{background:#121831;border:1px solid var(--line);padding:14px;border-radius:12px}.detail small{display:block;color:var(--muted);margin-bottom:7px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.status{color:var(--green);background:#183b38;padding:5px 9px;border-radius:99px;font-size:11px}.category-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.category-row button{background:#222a49;color:var(--muted);border:1px solid var(--line)}.category-row button.selected{background:var(--purple);color:#17132d}.notice{padding:14px 16px;border:1px solid #355c58;background:#15302f;color:#baf4e8;border-radius:12px;line-height:1.5;margin:15px 0}.qrbox{width:190px;height:190px;margin:20px auto;background:white;border-radius:12px;display:grid;place-items:center;color:#14172a;font-size:14px;font-weight:900;text-align:center;padding:16px;position:relative}.qrbox:before{content:"";position:absolute;inset:12px;border:5px dashed #222;border-radius:4px;opacity:.8}.qrbox span{position:relative;background:white;padding:8px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;background:#111730;border:1px solid var(--line);color:white;border-radius:10px;padding:12px}.empty{color:var(--muted);padding:30px;text-align:center}.hidden{display:none!important}.footer{color:#667195;font-size:12px;text-align:center;padding:20px}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:5px}.navlabel,.sidebar-foot{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:10px}.nav button span{width:auto;margin-right:5px}.topbar{padding:16px 20px}.content{padding:22px 18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{font-size:65px;padding:0}.details{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.hero{padding:23px}.hero-art{display:none}.grid{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.topbar{align-items:flex-start}.topright .muted{display:none}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:23px}.details{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">A</div><div><b>Aarohana 2026</b><small>Student Event Portal</small></div></div>
  <div class="navlabel">WORKSPACE</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="home"><span>⌂</span>Overview</button>
    <button data-page="profile"><span>◉</span>Student Profile</button>
    <button data-page="events"><span>✦</span>Upcoming Events</button>
    <button data-page="history"><span>◷</span>Event History</button>
    <button data-page="registered"><span>▣</span>My Registrations</button>
  </nav>
  <div class="sidebar-foot"><b style="color:#e9ebff">Demo mode</b><br>This is a front-end prototype. Payment and login are simulated; no real money is charged.</div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="crumb">College Portal / <span id="crumbPage">Overview</span></div></div><div class="topright"><span class="muted" style="font-size:13px">Welcome back,</span><b id="topName">Reehana</b><div class="avatar" id="topAvatar">R</div></div></header>
  <div class="content" id="appContent"></div>
  <div class="footer">AAROHANA 2026 · College Event & APP Points Portal · Prototype</div>
</main>
</div>
<script>
const student={name:"Reehana",roll:"23A91A05XX",branch:"CSE - AIML",year:"2nd Year"};
let points=120, registered=[], completed=[{name:"Web Design Sprint",category:"Technical",date:"12 Aug 2026",status:"Completed",points:40},{name:"Campus Cultural Quiz",category:"Cultural",date:"28 Jul 2026",status:"Completed",points:30},{name:"Mini Hackathon",category:"Technical",date:"04 Jul 2026",status:"Completed",points:50}];
const events=[
{id:1,name:"Coding Contest",category:"Technical",date:"18 Nov 2026",time:"10:00 AM",venue:"Computer Lab 2",points:50,fee:100,desc:"Solve programming challenges and show off your problem-solving skills."},
{id:2,name:"UI/UX Design Jam",category:"Technical",date:"19 Nov 2026",time:"11:30 AM",venue:"Innovation Hub",points:35,fee:50,desc:"Design a delightful interface for a real-world student problem."},
{id:3,name:"Battle of Bands",category:"Cultural",date:"20 Nov 2026",time:"4:00 PM",venue:"Open-Air Stage",points:40,fee:150,desc:"Bring your sound, your crew, and your best live performance."},
{id:4,name:"Dance Showcase",category:"Cultural",date:"21 Nov 2026",time:"2:00 PM",venue:"Main Auditorium",points:30,fee:100,desc:"Solo and group dance performances across styles."},
{id:5,name:"Futsal Cup",category:"Sports",date:"22 Nov 2026",time:"9:00 AM",venue:"College Sports Ground",points:45,fee:100,desc:"Fast-paced team football, friendly rivalry, and campus spirit."},
{id:6,name:"Chess Arena",category:"Sports",date:"22 Nov 2026",time:"1:00 PM",venue:"Student Activity Room",points:25,fee:50,desc:"Compete in a strategic rapid chess tournament."}
];
let category="All", page="home", selectedEvent=null;
const $=id=>document.getElementById(id);
function setPage(p){page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("crumbPage").textContent=({home:"Overview",profile:"Student Profile",events:"Upcoming Events",history:"Event History",registered:"My Registrations",details:"Event Details",payment:"Payment",success:"Registration Successful"})[p]||"Overview";render();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
function eventCard(e){return `<article class="event-card"><span class="tag">${e.category}</span><h3>${e.name}</h3><p>${e.desc}</p><div class="event-meta"><span>▦ ${e.date}</span><span>◷ ${e.time}</span><span>⌖ ${e.venue}</span></div><div class="bottom"><div><div class="points">+${e.points} APP pts</div><small class="muted">₹${e.fee} entry</small></div><button onclick="openEvent(${e.id})">View event ↗</button></div></article>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Your campus. Your moment.</div><h1>Make it count at<br>Aarohana 2026.</h1><p>Discover events, register in a few clicks, and keep track of every APP point you earn. Your next campus highlight starts here.</p><div class="actions"><button onclick="setPage('events')">Explore events ↗</button><button class="secondary" onclick="setPage('profile')">View my profile</button></div></div><div class="hero-art">✦</div></section>
<div class="stats"><div class="stat"><span class="ico">✧</span><small>Total APP Points</small><strong id="pointStat">${points}</strong><small>Across completed events</small></div><div class="stat"><span class="ico">▣</span><small>Events Completed</small><strong>${completed.length}</strong><small>Keep building your record</small></div><div class="stat"><span class="ico">◷</span><small>Upcoming Events</small><strong>${events.length}</strong><small>Open for registration</small></div><div class="stat"><span class="ico">✓</span><small>My Registrations</small><strong>${registered.length}</strong><small>For Aarohana 2026</small></div></div>
<div class="section-head"><h2>Featured events</h2><button class="secondary" onclick="setPage('events')">View all events →</button></div><div class="grid">${events.slice(0,3).map(eventCard).join("")}</div>
<div class="section-head"><h2>Recent activity</h2><button class="ghost" onclick="setPage('history')">View history →</button></div><div class="panel"><div class="table-wrap">${historyTable(completed.slice(0,3))}</div></div>`}
function profile(){return `<div class="eyebrow">Your account</div><h1>Student Profile</h1><p class="muted">Your student details and APP points at a glance.</p><section class="panel"><div class="profile"><div class="bigavatar">R</div><div><h2 style="margin-bottom:6px">${student.name}</h2><div class="muted">Student profile · ${student.branch}</div><div class="actions"><button class="secondary" onclick="editProfile()">Edit demo profile</button></div></div></div><div class="details"><div class="detail"><small>Roll Number</small><b>${student.roll}</b></div><div class="detail"><small>Branch</small><b>${student.branch}</b></div><div class="detail"><small>Academic Year</small><b>${student.year}</b></div><div class="detail"><small>Total APP Points</small><b class="points">${points}</b></div></div></section><div class="stats"><div class="stat"><small>Previous event points</small><strong>${completed.reduce((a,e)=>a+e.points,0)}</strong><small>From completed events</small></div><div class="stat"><small>New points earned</small><strong>${points-completed.reduce((a,e)=>a+e.points,0)}</strong><small>Demo total adjustment</small></div><div class="stat"><small>Registered events</small><strong>${registered.length}</strong><small>Aarohana 2026</small></div><div class="stat"><small>Notifications</small><strong>2</strong><small>Event updates available</small></div></div>`}
function eventsPage(){return `<div class="eyebrow">Find your next experience</div><h1>Upcoming Events</h1><p class="muted">Choose a category and explore Aarohana 2026.</p><div class="category-row">${["All","Technical","Cultural","Sports"].map(c=>`<button class="${category===c?'selected':''}" onclick="setCategory('${c}')">${c}</button>`).join("")}</div><div class="grid">${events.filter(e=>category==="All"||e.category===category).map(eventCard).join("")}</div>`}
function historyTable(items){if(!items.length)return `<div class="empty">No event history yet.</div>`;return `<table><thead><tr><th>Event name</th><th>Category</th><th>Date</th><th>Status</th><th>APP points</th></tr></thead><tbody>${items.map(e=>`<tr><td><b>${e.name}</b></td><td>${e.category}</td><td>${e.date}</td><td><span class="status">${e.status}</span></td><td class="points">+${e.points}</td></tr>`).join("")}</tbody></table>`}
function historyPage(){return `<div class="eyebrow">Your achievements</div><h1>Previous Events History</h1><p class="muted">A record of events you have completed and points earned.</p><div class="stats"><div class="stat"><small>Completed events</small><strong>${completed.length}</strong></div><div class="stat"><small>Points from history</small><strong>${completed.reduce((a,e)=>a+e.points,0)}</strong></div></div><div class="panel"><div class="table-wrap">${historyTable(completed)}</div></div>`}
function registeredPage(){return `<div class="eyebrow">Your schedule</div><h1>My Registered Events</h1><p class="muted">Check registration status and mark a demo event completed to test APP point updates.</p>${registered.length?`<div class="grid">${registered.map(r=>`<article class="event-card"><span class="tag">${r.category}</span><h3>${r.name}</h3><p>${r.date} · ${r.time}</p><div class="event-meta"><span>⌖ ${r.venue}</span><span>₹${r.fee}</span></div><div class="notice">✓ Registration successful</div>${r.completed?`<span class="points">Completed · +${r.points} APP points added</span>`:`<button onclick="completeEvent(${r.id})">Mark event completed (demo)</button>`}</article>`).join("")}</div>`:`<div class="panel empty">You haven't registered for an event yet.<br><br><button onclick="setPage('events')">Browse events</button></div>`}` }
function openEvent(id){selectedEvent=events.find(e=>e.id===id);setPage("details")}
function detailsPage(){let e=selectedEvent;if(!e)return eventsPage();let already=registered.some(r=>r.id===e.id);return `<div class="eyebrow">${e.category} event</div><h1>${e.name}</h1><p class="muted">Aarohana 2026 · Event details</p><div class="panel"><span class="tag">${e.category}</span><h2 style="font-size:28px;margin-top:18px">${e.name}</h2><p class="muted" style="line-height:1.7">${e.desc}</p><div class="details"><div class="detail"><small>Date</small><b>${e.date}</b></div><div class="detail"><small>Time</small><b>${e.time}</b></div><div class="detail"><small>Venue</small><b>${e.venue}</b></div><div class="detail"><small>APP Points</small><b class="points">+${e.points}</b></div></div><div class="notice">Entry fee: ₹${e.fee}. Payment below is a simulation for project demonstration only.</div><div class="actions"><button ${already?'disabled':''} onclick="startPayment()">${already?'Already registered':'Register now · ₹'+e.fee}</button><button class="secondary" onclick="setPage('events')">Back to events</button></div></div>`}
function paymentPage(){let e=selectedEvent;if(!e)return eventsPage();return `<div class="eyebrow">Secure registration</div><h1>Proceed to Payment</h1><p class="muted">Complete this simulated payment step to confirm your event registration.</p><div class="panel" style="max-width:650px;margin:auto;text-align:center"><h2>${e.name}</h2><p class="muted">${e.date} · ${e.time}</p><div class="qrbox"><span>DEMO<br>PAYMENT QR<br>₹${e.fee}</span></div><h2>₹${e.fee}</h2><p class="muted">Demo QR only — do not scan or send money.</p><div class="notice">This prototype does not connect to a payment gateway. Press the button to simulate payment success.</div><button onclick="finishPayment()">Simulate payment successful</button><div style="margin-top:12px"><button class="ghost" onclick="setPage('details')">Cancel and go back</button></div></div>`}
function successPage(){return `<div class="panel" style="max-width:650px;margin:45px auto;text-align:center;padding:40px"><div style="font-size:55px;color:var(--green)">✓</div><div class="eyebrow">You're all set</div><h1>Registration Successful!</h1><p class="muted">${selectedEvent?selectedEvent.name:"Your event"} has been added to your registrations.</p><div class="notice">Payment simulated successfully. APP points will update after the event is marked completed.</div><div class="actions" style="justify-content:center"><button onclick="setPage('registered')">View my registrations</button><button class="secondary" onclick="setPage('events')">Explore more events</button></div></div>`}
function editProfile(){const name=prompt("Enter student name",student.name);if(name&&name.trim()){student.name=name.trim();$("topName").textContent=student.name;$("topAvatar").textContent=student.name[0].toUpperCase();render()}}
function setCategory(c){category=c;render()}
function startPayment(){setPage("payment")}
function finishPayment(){if(!selectedEvent)return; if(!registered.some(r=>r.id===selectedEvent.id))registered.push({...selectedEvent,completed:false});setPage("success")}
function completeEvent(id){let r=registered.find(x=>x.id===id);if(r&&!r.completed){r.completed=true;points+=r.points;completed.unshift({name:r.name,category:r.category,date:r.date,status:"Completed",points:r.points});render();}}
function render(){let views={home,profile,events:eventsPage,history:historyPage,registered:registeredPage,details:detailsPage,payment:paymentPage,success:successPage};$("appContent").innerHTML=(views[page]||home)();$("topName").textContent=student.name;$("topAvatar").textContent=student.name[0].toUpperCase()}
render();
</script>
</body>
</html>
